[package]
name = "multi_transport_spaceships"
version.workspace = true
authors = [
  "Charles Bournhonesque <charlesbour@gmail.com>",
  "Richard Jones <rj@metabrew.com>",
]
edition.workspace = true
publish = false

[features]
default = ["gui", "client", "server"]
client = []
server = []
gui = [
    "bevy/bevy_sprite_render",
    "bevy/bevy_render",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/default_font",
    "bevy/x11",
    "bevy/bevy_post_process",
    "bevy/bevy_gizmos",
    "bevy/bevy_text",
    "bevy/bevy_core_pipeline",
    "bevy/tonemapping_luts",
]

[dependencies]
lightyear = { workspace = true, features = [
  "client",
  "server",
  "interpolation",
  "prediction",
  "replication",
  "leafwing",
  "avian2d",
  "std",
  "netcode",
  "udp",
  "webtransport",
  "websocket",
] }
lightyear_frame_interpolation.workspace = true
leafwing-input-manager = { workspace = true, features = ["keyboard", "mouse"] }
avian2d = { workspace = true, features = [
  "2d",
  "f32",
  "parry-f32",
  "parallel",
  "serialize",
] }
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy = { workspace = true, features = ["bevy_state"] }
clap = { version = "4.0", features = ["derive"] }
anyhow.workspace = true

[lints]
workspace = true

[[bin]]
name = "multi_transport_spaceships"
doc = false
