[package]
name = "multi_transport_launcher"
version = "0.25.5"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { workspace = true, default-features = false, features = [
  "bevy_asset",
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_gizmos",
  "x11",
  "wayland",
  "default_font",
] }
bevy_egui = { workspace = true }
lightyear = { path = "../../lightyear", features = [
  "client",
  "server",
  "prediction",
  "interpolation",
  "replication",
  "input_native",
] }

# utils
rand.workspace = true
tracing.workspace = true
serde.workspace = true

# For multi-transport support
multi_transport_simple_box = { path = "../multi_transport_simple_box" }

clap = { version = "4.5.3", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
ron = "0.12"
tempfile = "3.19"

[lints]
workspace = true
