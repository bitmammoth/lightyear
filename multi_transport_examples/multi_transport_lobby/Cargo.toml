[package]
name = "multi_transport_lobby"
version = "0.25.5"
edition = "2021"
publish = false

[features]
default = ["client", "server", "gui"]
client = ["lightyear/client"]
server = ["lightyear/server"]
gui = []

[dependencies]
bevy = { workspace = true, features = [
    "bevy_gizmos",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_winit",
    "bevy_window",
    "bevy_ui",
    "bevy_text",
    "default_font",
    "png",
    "x11",
] }
lightyear = { path = "../../lightyear", features = [
    "std",
    "udp",
    "netcode",
    "webtransport",
    "websocket",
    "interpolation",
    "prediction",
    "replication",
    "input_native",
] }

bevy_egui.workspace = true
egui_extras.workspace = true
serde.workspace = true
tracing.workspace = true
clap.workspace = true

[lints]
workspace = true
