[package]
name = "multi_transport_example"
version = "0.25.5"
edition = "2021"
publish = false

[dependencies]
bevy = { workspace = true }
lightyear = { path = "../../lightyear", features = ["server", "client", "udp", "webtransport", "websocket", "netcode"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "multi_transport_example"
path = "src/main.rs"
