[package]
name = "simple_box_multi_transport"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "simple_box_multi"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.17.3", default-features = false, features = [
    "bevy_state",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_gizmos",
    "bevy_log",
    "bevy_picking",
    "default_font",
    "x11",
] }
bevy-inspector-egui = "0.35"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

# Lightyear crates with required features
lightyear = { path = "../../lightyear", features = [
    "client",
    "server",
    "netcode",
    "udp",
    "webtransport",
    "prediction",
    "interpolation",
    "replication",
    "input_native",
] }

[features]
default = ["server", "client"]
server = []
client = []
